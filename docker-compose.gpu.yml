version: "3.9"

# GPU override for VisionAI services
# Usage: docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d
#
# Prerequisites:
#   - NVIDIA GPU drivers installed on host
#   - NVIDIA Container Toolkit installed (nvidia-docker2)
#   - Docker configured with nvidia runtime

services:
  worker:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu, compute, utility, video]
    environment:
      NVIDIA_VISIBLE_DEVICES: ${NVIDIA_VISIBLE_DEVICES:-all}
      NVIDIA_DRIVER_CAPABILITIES: compute,utility,video
      CUDA_VISIBLE_DEVICES: ${CUDA_VISIBLE_DEVICES:-all}
      CV_USE_GPU: "true"
      CV_GPU_DEVICE_ID: ${CV_GPU_DEVICE_ID:-0}
      TORCH_CUDA_ARCH_LIST: ${TORCH_CUDA_ARCH_LIST:-}
      OMP_NUM_THREADS: ${OMP_NUM_THREADS:-4}
    shm_size: "2gb"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:ro
