version: "3.9"

services:
  # ──────────────────────────────────────────────
  # PostgreSQL with pgvector extension
  # ──────────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    container_name: visionai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-visionai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-visionai_secret}
      POSTGRES_DB: ${POSTGRES_DB:-visionai}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-visionai} -d ${POSTGRES_DB:-visionai}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - visionai-network

  # ──────────────────────────────────────────────
  # Redis for caching, Celery broker, and pub/sub
  # ──────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: visionai-redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-visionai_redis}
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
      --appendfsync everysec
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-visionai_redis}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - visionai-network

  # ──────────────────────────────────────────────
  # MinIO object storage for images, videos, models
  # ──────────────────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: visionai-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-visionai_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-visionai_minio_secret}
    volumes:
      - minio_data:/data
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - visionai-network

  # ──────────────────────────────────────────────
  # MediaMTX RTSP/HLS media server
  # ──────────────────────────────────────────────
  mediamtx:
    image: bluenviron/mediamtx:latest
    container_name: visionai-mediamtx
    restart: unless-stopped
    environment:
      MTX_PROTOCOLS: tcp,udp
      MTX_HLSADDRESS: ":8888"
      MTX_API: "yes"
      MTX_APIADDRESS: ":9997"
    ports:
      - "${RTSP_PORT:-8554}:8554"
      - "${RTSP_PORT:-8554}:8554/udp"
      - "${HLS_PORT:-8888}:8888"
      - "${WEBRTC_PORT:-8889}:8889"
      - "${WEBRTC_PORT:-8889}:8889/udp"
      - "9997:9997"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8888"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - visionai-network

  # ──────────────────────────────────────────────
  # FastAPI backend (API server)
  # ──────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: visionai-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-visionai}:${POSTGRES_PASSWORD:-visionai_secret}@postgres:5432/${POSTGRES_DB:-visionai}
      REDIS_URL: redis://:${REDIS_PASSWORD:-visionai_redis}@redis:6379/0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:-visionai_redis}@redis:6379/1
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:-visionai_redis}@redis:6379/2
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-visionai_minio}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-visionai_minio_secret}
      MINIO_USE_SSL: "false"
      MEDIAMTX_API_URL: http://mediamtx:9997
      MEDIAMTX_RTSP_URL: rtsp://mediamtx:8554
    volumes:
      - models_data:/app/models
      - ./backend:/app/backend:ro
    devices:
      - /dev/video0:/dev/video0
      - /dev/video1:/dev/video1
      - /dev/video4:/dev/video4
      - /dev/video5:/dev/video5
    group_add:
      - video
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - visionai-network

  # ──────────────────────────────────────────────
  # Celery worker for background CV processing
  # ──────────────────────────────────────────────
  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: visionai-worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-visionai}:${POSTGRES_PASSWORD:-visionai_secret}@postgres:5432/${POSTGRES_DB:-visionai}
      REDIS_URL: redis://:${REDIS_PASSWORD:-visionai_redis}@redis:6379/0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:-visionai_redis}@redis:6379/1
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:-visionai_redis}@redis:6379/2
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-visionai_minio}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-visionai_minio_secret}
      MINIO_USE_SSL: "false"
      MEDIAMTX_API_URL: http://mediamtx:9997
      MEDIAMTX_RTSP_URL: rtsp://mediamtx:8554
      CV_MODELS_PATH: /app/models
    volumes:
      - models_data:/app/models
      - ./backend:/app/backend:ro
    devices:
      - /dev/video0:/dev/video0
      - /dev/video1:/dev/video1
      - /dev/video4:/dev/video4
      - /dev/video5:/dev/video5
    group_add:
      - video
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.workers.celery_app inspect ping --timeout 10"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 45s
    networks:
      - visionai-network

  # ──────────────────────────────────────────────
  # Celery Beat scheduler for periodic tasks
  # ──────────────────────────────────────────────
  beat:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: visionai-beat
    restart: unless-stopped
    command: celery -A app.workers.celery_app beat --loglevel=info --schedule=/tmp/celerybeat-schedule --pidfile=/tmp/celerybeat.pid
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-visionai}:${POSTGRES_PASSWORD:-visionai_secret}@postgres:5432/${POSTGRES_DB:-visionai}
      REDIS_URL: redis://:${REDIS_PASSWORD:-visionai_redis}@redis:6379/0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:-visionai_redis}@redis:6379/1
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:-visionai_redis}@redis:6379/2
    depends_on:
      redis:
        condition: service_healthy
      worker:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.workers.celery_app inspect ping --timeout 10"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 30s
    networks:
      - visionai-network

  # ──────────────────────────────────────────────
  # Next.js frontend
  # ──────────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: visionai-frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-/ws}
      NEXT_PUBLIC_STREAM_URL: ${NEXT_PUBLIC_STREAM_URL:-/stream}
      NODE_ENV: production
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - visionai-network

  # ──────────────────────────────────────────────
  # Nginx reverse proxy with SSL termination
  # ──────────────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: visionai-nginx
    restart: unless-stopped
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ${SSL_CERT_PATH:-./nginx/certs/fullchain.pem}:/etc/nginx/ssl/fullchain.pem:ro
      - ${SSL_KEY_PATH:-./nginx/certs/privkey.pem}:/etc/nginx/ssl/privkey.pem:ro
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    depends_on:
      api:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:80/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - visionai-network

# ──────────────────────────────────────────────
# Persistent volumes
# ──────────────────────────────────────────────
volumes:
  postgres_data:
    driver: local
    name: visionai-postgres-data
  redis_data:
    driver: local
    name: visionai-redis-data
  minio_data:
    driver: local
    name: visionai-minio-data
  models_data:
    driver: local
    name: visionai-models-data

# ──────────────────────────────────────────────
# Network
# ──────────────────────────────────────────────
networks:
  visionai-network:
    driver: bridge
    name: visionai-network
